<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Personal Finance Tracker - Offline-first PWA untuk tracking keuangan pribadi dengan multi-wallet support" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- Capacitor: ensure proper CSP for native WebView -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; 
                   img-src 'self' https: data: blob:; 
                   font-src 'self' https: data:;
                   connect-src 'self' https: http: ws: wss: capacitor:;
                   style-src 'self' https: 'unsafe-inline';" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>FinTrack - Personal Finance Tracker</title>
    <script>
      // Apply the saved UI template + color mode before first paint so the app
      // never flashes the wrong look on startup.
      (function () {
        try {
          var root = document.documentElement;
          var tpl = localStorage.getItem('template') || 'wattvision';
          root.setAttribute('data-template', tpl);
          var mode = localStorage.getItem('theme');
          root.classList.remove('dark', 'light');
          root.classList.add(mode === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-template', 'classic');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
